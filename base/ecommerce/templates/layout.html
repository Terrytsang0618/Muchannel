{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="author" content="K-pop Store" />
    <meta name="description" content="K-pop Store - Your destination for K-pop albums and merchandise">
    <link rel="icon" type="image/png" href="{% static 'assets/images/favicon.png' %}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Document title -->
    <title>{% block title %}K-pop Store{% endblock %}</title>

    <!-- POLO Template Stylesheets & Fonts (from assets) -->
    <link href="{% static 'assets/css/plugins.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet">

    <!-- Custom Styles (override POLO template) -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <!-- Tailwind CSS CDN (optional - can be used alongside POLO template) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Body Inner -->
    <div class="body-inner">
        <!-- Include Header -->
        {% include 'includes/header.html' %}

        <!-- Include Artists Sidebar (Desktop Only) -->
        {% include 'includes/sidebar.html' %}

        <!-- Page Content -->
        <section id="page-content">
            <div class="container">
            {% block content %}
            {% endblock %}
            </div>
        </section>
        <!-- end: Page Content -->
    </div>
    <!-- end: Body Inner -->

    <!-- Scroll top -->
    <a id="scrollTop"><i class="icon-chevron-up"></i><i class="icon-chevron-up"></i></a>

    <!-- POLO Template Scripts (from assets) -->
    <script src="{% static 'assets/js/jquery.js' %}"></script>
    <script src="{% static 'assets/js/plugins.js' %}"></script>
    <script src="{% static 'assets/js/functions.js' %}"></script>

    <!-- Custom JavaScript -->
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
