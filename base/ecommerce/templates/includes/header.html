{% load static %}
<!-- Header -->
<header id="header" data-transparent="true" class="light header-logo-center">
    <div class="header-inner">
        <div class="container">
            <!--Logo-->
            <div id="logo">
                <a href="{% url 'home' %}">
                    <span class="logo-default">ATMOSTARS</span>
                    <span class="logo-dark">ATMOSTARS </span>
                </a>
            </div>
            <!--End: Logo-->
            <!-- Search -->
            <div id="search"><a id="btn-search-close" class="btn-search-close" aria-label="Close search form"><i class="icon-x"></i></a>
                <form class="search-form" action="#" method="get">
                    <input class="form-control" name="q" type="text" placeholder="Type & Search..." />
                    <span class="text-muted">Start typing & press "Enter" or "ESC" to close</span>
                </form>
            </div>
            <!-- end: search -->
            <!--Header Extras-->
            <div class="header-extras">
                <ul>
                    <li>
                        <a id="btn-search" href="#"> <i class="icon-search"></i></a>
                    </li>
                    <li class="desktop-only" id="user-account-menu">
                        <div class="p-dropdown">
                            <a href="#"><i class="icon-user"></i></a>
                            <ul class="p-dropdown-content">
                                <!-- Auth Buttons (shown when NOT logged in) - Default visible for anonymous users -->
                                <li id="auth-login-link">
                                    <a href="#" onclick="openAuthModal('login'); return false;">Login</a>
                                </li>
                                <li id="auth-register-link">
                                    <a href="#" onclick="openAuthModal('register'); return false;">Register</a>
                                </li>
                                <!-- User Menu (shown when logged in) - Default hidden -->
                                <li id="user-profile-link" style="display: none;">
                                    <a href="#"><i class="icon-user"></i> Profile</a>
                                </li>
                                <li id="user-orders-link" style="display: none;">
                                    <a href="#"><i class="icon-shopping-bag"></i> My Orders</a>
                                </li>
                                <li id="user-wishlist-link" style="display: none;">
                                    <a href="#"><i class="icon-heart"></i> Wishlist</a>
                                </li>
                                <li id="user-settings-link" style="display: none;">
                                    <a href="#"><i class="icon-settings"></i> Settings</a>
                                </li>
                                <li id="user-logout-link" style="display: none;">
                                    <a href="#" onclick="handleLogout(); return false;"><i class="icon-log-out"></i> Logout</a>
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li class="desktop-only">
                        <a href="#">
                            <i class="icon-shopping-cart"></i>
                            <span id="cart-count" class="badge bg-danger">0</span>
                        </a>
                    </li>
                    <li>
                        <div class="p-dropdown">
                            <a href="#"><i class="icon-globe"></i><span>EN</span></a>
                            <ul class="p-dropdown-content">
                                <li><a href="#">English</a></li>
                                <li><a href="#">Korean</a></li>
                                <li><a href="#">Japanese</a></li>
                                <li><a href="#">Chinese</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
            <!--end: Header Extras-->
            <!--Navigation Resposnive Trigger-->
            <div id="mainMenu-trigger">
                <a class="lines-button x"><span class="lines"></span></a>
            </div>
            <!--end: Navigation Resposnive Trigger-->
            <!--Navigation-->
            <div id="mainMenu">
                <div class="container">
                    <nav>
                        <!--Left Menu (Desktop: Sidebar Toggle, New, Music, MD | Mobile: New, Music, MD, Artists)-->
                        <ul>
                            <!-- Sidebar Toggle: Only visible on Desktop -->
                            <li class="desktop-only-menu">
                                <a href="#" onclick="toggleSidebar(); return false;">
                                    <i class="icon-menu"></i>
                                </a>
                            </li>
                            <li><a href="{% url 'products_list' %}">New</a></li>
                            <li><a href="{% url 'products_list' %}?category=music">Music</a></li>
                            <li><a href="{% url 'products_list' %}?category=md">MD</a></li>
                            <!-- Artists: Only visible on Mobile -->
                            <li class="d-lg-none"><a href="#">Artists</a></li>
                        </ul>
                        <!--Right Menu (Empty on Desktop, used by mobile menu)-->
                        <ul>
                            <!-- Empty - header-extras handles icons on desktop -->
                        </ul>
                    </nav>
                </div>
            </div>
            <!--end: Navigation-->
        </div>
    </div>
</header>
<!-- end: Header -->
