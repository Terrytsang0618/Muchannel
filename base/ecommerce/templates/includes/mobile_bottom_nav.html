{% load static %}
<!-- Mobile Bottom Tab Bar (Only visible on mobile devices) -->
<div class="mobile-bottom-tab-bar">

        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <a href="#" class="tab-item" data-tab="search" id="mobile-search-btn">
        <i class="fas fa-search"></i>
        <span>Search</span>
    </a>
    <a href="#" class="tab-item" data-tab="cart" id="mobile-cart-btn">
        <div class="tab-icon-wrapper">

    <a href="#" class="tab-item" data-tab="user" id="mobile-user-btn">
        <i class="fas fa-user"></i>
