{% load static %}
<!-- Login/Register Modal -->
<div class="modal fade" id="auth-modal" tabindex="-1" role="modal" aria-labelledby="auth-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title" id="auth-modal-title">Login</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true" onclick="closeAuthModal()">×</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <!-- Error/Success Message Container -->
                <div id="auth-message" class="alert" style="display: none;"></div>

                <!-- Login Form -->
                <form id="login-form" style="display: block;">
                    <div class="form-group mb-3">
                        <label for="login-username" class="form-label">Username or Email</label>
                        <input type="text"
                               class="form-control"
                               id="login-username"
                               name="username"
                               placeholder="Enter your username"
                               required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="login-password" class="form-label">Password</label>
                        <input type="password"
                               class="form-control"
                               id="login-password"
                               name="password"
                               placeholder="Enter your password"
                               required>
                    </div>
                    <div class="form-group mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me">
                            <label class="form-check-label" for="remember-me">Remember me</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" id="login-submit-btn">
                        <i class="icon-lock"></i> Login
                    </button>
                    <div class="text-center">
                        <p class="mb-2">Don't have an account?
                            <a href="#" onclick="switchToRegister(); return false;" class="text-primary">Register here</a>
                        </p>
                        <p>
                            <a href="#" class="text-muted">Forgot password?</a>
                        </p>
                    </div>
                </form>

                <!-- Register Form -->
                <form id="register-form" style="display: none;">
                    <div class="form-group mb-3">
                        <label for="register-username" class="form-label">Username</label>
                        <input type="text"
                               class="form-control"
                               id="register-username"
                               name="username"
                               placeholder="Choose a username"
                               required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="register-email" class="form-label">Email</label>
                        <input type="email"
                               class="form-control"
                               id="register-email"
                               name="email"
                               placeholder="Enter your email"
                               required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="register-password" class="form-label">Password</label>
                        <input type="password"
                               class="form-control"
                               id="register-password"
                               name="password"
                               placeholder="Create a password"
                               required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="register-password2" class="form-label">Confirm Password</label>
                        <input type="password"
                               class="form-control"
                               id="register-password2"
                               name="password2"
                               placeholder="Confirm your password"
                               required>
                    </div>
                    <div class="form-group mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="agree-terms" required>
                            <label class="form-check-label" for="agree-terms">
                                I agree to the <a href="#" class="text-primary">Terms & Conditions</a>
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" id="register-submit-btn">
                        <i class="icon-user"></i> Register
                    </button>
                    <div class="text-center">
                        <p>Already have an account?
                            <a href="#" onclick="switchToLogin(); return false;" class="text-primary">Login here</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
/* Custom Modal Styles for Auth Modal */
#auth-modal .modal-dialog {
    max-width: 500px;
}

#auth-modal .modal-header {
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
}

#auth-modal .modal-title {
    font-weight: 600;
    color: #333;
}

#auth-modal .btn-close {
    font-size: 24px;
    font-weight: 300;
    line-height: 1;
    opacity: 0.5;
}

#auth-modal .btn-close:hover {
    opacity: 1;
}

#auth-modal .form-control {
    border-radius: 4px;
    padding: 0.75rem;
    border: 1px solid #ced4da;
}

#auth-modal .form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
}

#auth-modal .alert {
    border-radius: 4px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
}

#auth-modal .alert-success {
    background-color: #d4edda;
    border-color: #c3e6cb;
    color: #155724;
}

#auth-modal .alert-danger {
    background-color: #f8d7da;
    border-color: #f5c6cb;
    color: #721c24;
}

#auth-modal .btn-primary {
    background-color: #007bff;
    border-color: #007bff;
    padding: 0.75rem 1rem;
    font-weight: 500;
    border-radius: 4px;
    transition: all 0.3s ease;
}

#auth-modal .btn-primary:hover {
    background-color: #0056b3;
    border-color: #0056b3;
}

#auth-modal .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Responsive Styles */
@media (max-width: 576px) {
    #auth-modal .modal-dialog {
        max-width: 95%;
        margin: 1rem auto;
    }

    #auth-modal .modal-header {
        padding: 0.75rem 1rem;
    }

    #auth-modal .modal-title {
        font-size: 1.25rem;
    }

    #auth-modal .modal-body {
        padding: 1rem;
    }

    #auth-modal .form-control {
        padding: 0.6rem;
        font-size: 14px;
    }

    #auth-modal .btn-primary {
        padding: 0.6rem 1rem;
        font-size: 14px;
    }

    #auth-modal .btn-close {
        font-size: 20px;
    }
}

@media (max-width: 768px) and (min-width: 577px) {
    #auth-modal .modal-dialog {
        max-width: 90%;
    }
}
</style>

<script>
// Modal Control Functions using Bootstrap Modal API
function openAuthModal(mode = 'login') {
    const modalElement = document.getElementById('auth-modal');

    if (modalElement) {
        // Use Bootstrap's modal API
        const modal = new bootstrap.Modal(modalElement);

        // Switch to appropriate form
        if (mode === 'register') {
            switchToRegister();
        } else {
            switchToLogin();
        }

        // Clear any previous messages
        clearAuthMessage();

        // Show modal
        modal.show();
    }
}

function closeAuthModal() {
    const modalElement = document.getElementById('auth-modal');

    if (modalElement) {
        const modal = bootstrap.Modal.getInstance(modalElement);
        if (modal) {
            modal.hide();
        }

        // Clear forms
        document.getElementById('login-form').reset();
        document.getElementById('register-form').reset();
        clearAuthMessage();
    }
}

function switchToLogin() {
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('auth-modal-title').textContent = 'Login';
    clearAuthMessage();
}

function switchToRegister() {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    document.getElementById('auth-modal-title').textContent = 'Register';
    clearAuthMessage();
}

function showAuthMessage(message, type = 'danger') {
    const messageEl = document.getElementById('auth-message');
    if (messageEl) {
        messageEl.textContent = message;
        messageEl.className = `alert alert-${type}`;
        messageEl.style.display = 'block';
    }
}

function clearAuthMessage() {
    const messageEl = document.getElementById('auth-message');
    if (messageEl) {
        messageEl.style.display = 'none';
        messageEl.textContent = '';
    }
}

// Login Form Handler
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('login-submit-btn');
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="icon-loader"></i> Logging in...';

            try {
                // Call API login
                const response = await API.auth.login(username, password);

                // Show success message
                showAuthMessage('Login successful! Redirecting...', 'success');

                // Update UI (this will be handled by auth.js checkAuth)
                if (typeof authManager !== 'undefined') {
                    await authManager.checkAuth();
                }

                // Update cart count
                if (typeof updateCartCount === 'function') {
                    await updateCartCount();
                }

                // Close modal after short delay
                setTimeout(() => {
                    closeAuthModal();
                    // Reload page to refresh user state
                    window.location.reload();
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                const errorMessage = error.response?.data?.error || 'Invalid username or password. Please try again.';
                showAuthMessage(errorMessage, 'danger');
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="icon-lock"></i> Login';
            }
        });
    }

    if (registerForm) {
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('register-submit-btn');
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const password2 = document.getElementById('register-password2').value;

            // Validate passwords match
            if (password !== password2) {
                showAuthMessage('Passwords do not match!', 'danger');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="icon-loader"></i> Registering...';

            try {
                // Call API register
                const response = await API.auth.register({
                    username: username,
                    email: email,
                    password: password,
                    password2: password2
                });

                // Show success message
                showAuthMessage('Registration successful! Redirecting...', 'success');

                // Update UI
                if (typeof authManager !== 'undefined') {
                    await authManager.checkAuth();
                }

                // Update cart count
                if (typeof updateCartCount === 'function') {
                    await updateCartCount();
                }

                // Close modal after short delay
                setTimeout(() => {
                    closeAuthModal();
                    // Reload page to refresh user state
                    window.location.reload();
                }, 1000);

            } catch (error) {
                console.error('Registration error:', error);
                let errorMessage = 'Registration failed. Please try again.';

                if (error.response?.data) {
                    const errors = error.response.data;
                    // Format error messages
                    errorMessage = Object.entries(errors)
                        .map(([key, value]) => {
                            const messages = Array.isArray(value) ? value.join(', ') : value;
                            return `${key}: ${messages}`;
                        })
                        .join('\n');
                }

                showAuthMessage(errorMessage, 'danger');
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="icon-user"></i> Register';
            }
        });
    }

    // Close modal on ESC key (Bootstrap handles this automatically)
    // But we still clear forms
    const modalElement = document.getElementById('auth-modal');
    if (modalElement) {
        modalElement.addEventListener('hidden.bs.modal', function () {
            document.getElementById('login-form').reset();
            document.getElementById('register-form').reset();
            clearAuthMessage();
        });
    }
});
</script>
