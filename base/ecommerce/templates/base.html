{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NFT Ecommerce{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    <!-- Mobile Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden md:hidden" onclick="closeSidebar()"></div>

    <!-- Header -->
    <header class="bg-white shadow-md fixed top-0 left-0 right-0 z-10">
        <div class="flex items-center justify-between px-4 py-3">
            <!-- Mobile Menu Button & Logo -->
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <a href="{% url 'home' %}" class="flex items-center space-x-2">
                    <i class="fas fa-store text-2xl text-blue-600"></i>
                    <span class="text-xl font-bold text-gray-800 hidden sm:block">NFT Ecommerce</span>
                </a>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl mx-4 hidden sm:block">
                <div class="relative">
                    <input
                        type="text"
                        placeholder="Search products, NFTs..."
                        class="w-full px-4 py-2 pl-10 pr-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        onkeypress="handleSearch(event)"
                    >
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-4">
                <button class="relative text-gray-600 hover:text-gray-900">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
                <button class="text-gray-600 hover:text-gray-900 hidden sm:block">
                    <i class="fas fa-bell text-xl"></i>
                </button>
                <button class="text-gray-600 hover:text-gray-900">
                    <i class="fas fa-user-circle text-2xl"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Search -->
        <div class="px-4 pb-3 sm:hidden">
            <div class="relative">
                <input
                    type="text"
                    placeholder="Search..."
                    class="w-full px-4 py-2 pl-10 pr-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onkeypress="handleSearch(event)"
                >
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex pt-20">
        <!-- Left Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-white shadow-lg transform sidebar-transition md:transform-none sidebar-closed md:sidebar-closed-none z-30 mt-20 md:mt-0 overflow-y-auto custom-scrollbar">
            <nav class="p-4 space-y-2">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Main Menu</h2>

                <a href="{% url 'home' %}" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-th-large"></i>
                    <span>Products</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-palette"></i>
                    <span>NFT Collection</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-fire"></i>
                    <span>Trending</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-tag"></i>
                    <span>Categories</span>
                </a>

                <hr class="my-4 border-gray-200">

                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Account</h2>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-shopping-bag"></i>
                    <span>My Orders</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-heart"></i>
                    <span>Wishlist</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>

                <a href="#" class="nav-link flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:ml-0 min-h-screen">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
